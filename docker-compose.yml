# TechFlow — docker compose
# All configurable values come from the .env file at the repository root
# (copy .env.example to .env first). Compose reads .env automatically.
name: techflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TECHFLOW_DB_USER:-techflow}
      POSTGRES_PASSWORD: ${TECHFLOW_DB_PASSWORD:-techflow}
      POSTGRES_DB: ${TECHFLOW_DB_NAME:-techflow}
    ports:
      # Exposed on the host for tooling (pgAdmin, local clients).
      - "${TECHFLOW_DB_PORT_HOST:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TECHFLOW_DB_USER:-techflow} -d ${TECHFLOW_DB_NAME:-techflow}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Database: inside the compose network the Postgres host is "db".
      TECHFLOW_DB_HOST: db
      TECHFLOW_DB_PORT: "5432"
      TECHFLOW_DB_USER: ${TECHFLOW_DB_USER:-techflow}
      TECHFLOW_DB_PASSWORD: ${TECHFLOW_DB_PASSWORD:-techflow}
      TECHFLOW_DB_NAME: ${TECHFLOW_DB_NAME:-techflow}
      # Security
      TECHFLOW_SECRET_KEY: ${TECHFLOW_SECRET_KEY:?Set TECHFLOW_SECRET_KEY in .env}
      TECHFLOW_DEBUG: ${TECHFLOW_DEBUG:-0}
      # "backend" is needed because the Vite proxy forwards with
      # Host: backend (changeOrigin).
      TECHFLOW_ALLOWED_HOSTS: ${TECHFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # The Vite dev server origin (browser -> :5173). Extend in .env for
      # other hosts/domains.
      TECHFLOW_CSRF_TRUSTED_ORIGINS: ${TECHFLOW_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      # Bootstrap
      TECHFLOW_ADMIN_USERNAME: ${TECHFLOW_ADMIN_USERNAME:-admin}
      TECHFLOW_ADMIN_PASSWORD: ${TECHFLOW_ADMIN_PASSWORD:-}
      TECHFLOW_SEED_DEMO: ${TECHFLOW_SEED_DEMO:-0}
    ports:
      - "${TECHFLOW_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PROXY_TARGET: http://backend:8000
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${TECHFLOW_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
